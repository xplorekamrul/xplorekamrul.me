<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Title and description are also set from assets/data/content.json (meta); these copies are for search engines and link previews. -->
  <title>Md Kamruzzaman, Developer in Dhaka</title>
  <meta name="description"
    content="Md Kamruzzaman is a full-stack developer in Dhaka. Next.js, TypeScript, PostgreSQL. Seven platforms in production. Now at AdZoic.">
  <meta property="og:title" content="Md Kamruzzaman, Developer in Dhaka">
  <meta property="og:description" content="Full-stack developer. Seven platforms in production. Now at AdZoic.">
  <link rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2306070B'/%3E%3Ccircle cx='20' cy='22' r='5' fill='%23FFC766'/%3E%3Ccircle cx='44' cy='20' r='4' fill='%2366E0FF'/%3E%3Ccircle cx='32' cy='36' r='6' fill='%23B48CFF'/%3E%3Ccircle cx='18' cy='46' r='3.5' fill='%2366FFB0'/%3E%3Ccircle cx='47' cy='45' r='4.5' fill='%23FF7A8C'/%3E%3C/svg%3E">

  <!-- Everything is local: fonts, styles, scripts. Nothing is loaded from another server. -->
  <link rel="preload" href="assets/data/content.json" as="fetch" crossorigin>
  <link rel="preload" href="assets/fonts/bricolage-grotesque-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/instrument-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/main.css">

  <!-- Runs before the first paint: saved theme, and a safety net so the loader never traps the page. -->
  <script>
    (function () {
      var d = document.documentElement;
      d.classList.add('js');
      try {
        var t = localStorage.getItem('mk3-theme');
        if (t === 'dark' || t === 'light') d.setAttribute('data-theme', t);
      } catch (e) { }
      /* The loader can never trap the page: it is dismissed after 5s whatever happens. */
      setTimeout(function () { d.classList.add('is-ready'); }, 5000);
      /* Opened straight from disk: browsers block modules and JSON there, so say how to run it. */
      if (location.protocol === 'file:') {
        d.classList.add('is-ready');
        document.addEventListener('DOMContentLoaded', function () {
          document.getElementById('main').innerHTML = '<p class="boot-error">This site loads its content from assets/data/content.json, ' +
            'which browsers do not allow for a file opened from disk.<br>Run it through a local server instead: ' +
            'VS Code "Live Server", or <code>npx serve</code> in this folder.</p>';
        });
      }
    })();
  </script>
</head>

<body>
  <a class="skip" href="#main">Skip to content</a>

  <canvas class="gl" id="gl" aria-hidden="true"></canvas>

  <div class="loader" id="loader" aria-hidden="true">
    <p class="loader__who" data-render="loaderWho"></p>
    <div>
      <div class="loader__row">
        <p class="loader__log" id="loadLog">$ npm run build</p>
        <p class="loader__n" id="loadN">0</p>
      </div>
      <div class="loader__bar"><i id="loadBar"></i></div>
    </div>
  </div>

  <div class="cursor" id="cursor" aria-hidden="true"><i class="cursor__dot"></i><span class="cursor__label"
      id="cursorLabel"></span></div>
  <aside class="jobcard" id="jobCard" aria-hidden="true">
    <div class="jobcard__in" id="jobCardIn"></div>
  </aside>
  <div class="peek" id="peek" aria-hidden="true">
    <div class="peek__card" id="peekCard"><span class="peek__ini" id="peekIni"></span><span class="peek__url" id="peekUrl"></span></div>
  </div>

  <header class="top" id="top">
    <a class="brand" id="brand" href="#home" data-render="brand"></a>
    <nav class="nav" aria-label="Sections" data-render="navHeader"></nav>
    <div class="tools">
      <button class="iconbtn" id="termBtn" type="button" aria-label="Open the terminal" title="Terminal (Ctrl+K)"
        aria-expanded="false" aria-controls="term"><span aria-hidden="true">&gt;_</span></button>
      <button class="pill" id="bugBtn" type="button" aria-expanded="false" aria-controls="bugLog">
        <span class="pill__lv" id="xpLv">1</span><span class="pill__name" id="xpName">Intern</span><span
          class="pill__sep" aria-hidden="true"></span>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <use href="#bug" />
        </svg><b id="bugCount">0/7</b>
      </button>
      <button class="iconbtn" id="themeBtn" type="button" aria-label="Switch theme">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.5" />
          <path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor" />
        </svg>
      </button>
      <button class="iconbtn burger" id="menuBtn" type="button" aria-label="Open the menu" aria-expanded="false"
        aria-controls="menu"><i></i><i></i></button>
    </div>
  </header>

  <nav class="menu" id="menu" aria-label="Menu" data-render="navMenu" hidden></nav>

  <nav class="dots" aria-label="Chapters" data-render="navDots"></nav>

  <aside class="buglog" id="bugLog" aria-label="Your progress" hidden>
    <div class="buglog__head">
      <div>
        <h2 id="xpTitle">Level 1, Intern</h2>
        <p class="buglog__sub" id="xpSub">0 of 1000 XP</p>
      </div>
      <button class="buglog__close" id="bugClose" type="button">Close</button>
    </div>
    <div class="xpbar" aria-hidden="true"><i id="xpFill"></i></div>
    <h3>Quests</h3>
    <ol class="quests" id="questList"></ol>
    <h3>Bug tracker</h3>
    <p class="buglog__sub" id="bugSub">7 bugs are crawling around this site. Find them and squash them.</p>
    <ol class="buglog__list" id="bugList"></ol>
    <label class="buglog__reward" id="bugReward" hidden><input type="checkbox" id="prismToggle"> Prismatic
      particles</label>
    <button class="buglog__reset" id="bugReset" type="button">Reset my progress</button>
  </aside>

  <section class="term" id="term" role="dialog" aria-label="Terminal" hidden>
    <div class="term__bar"><span class="term__dots" aria-hidden="true"><i></i><i></i><i></i></span><span class="term__title">visitor@kamruzzaman: ~ <em>kzsh</em></span><span class="term__clock" id="termClock" aria-hidden="true"></span><button type="button" id="termClose">Close</button></div>
    <div class="term__out" id="termOut" aria-live="polite"></div>
    <div class="term__tips" id="termTips" aria-label="Suggestions"></div>
    <div class="term__in"><label for="termIn"><span class="t-ok">visitor</span><span class="t-dim">@</span><span class="t-key">kamruzzaman</span><span class="t-dim">:</span><span class="t-purple">~</span><span class="t-dim">$</span></label><input id="termIn" type="text" enterkeyhint="go"
        autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
        aria-label="Command, press Enter to run"><button type="button" id="termRun">Run</button></div>
  </section>

  <aside class="keys" id="keys" role="dialog" aria-label="Keyboard shortcuts" hidden>
    <div class="keys__head">
      <h2 data-render="shortcutsTitle"></h2><button type="button" id="keysClose">Close</button>
    </div>
    <dl data-render="shortcutsList"></dl>
  </aside>

  <div class="typed" id="typed" aria-hidden="true" hidden><b id="typedText"></b><span>Esc clears</span></div>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="bug" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <path d="M8 9 4.5 6.5M16 9l3.5-2.5M7 13H3M17 13h4M8 17l-3.5 2.5M16 17l3.5 2.5M10 5 8.5 2.5M14 5l1.5-2.5" />
      </g>
      <ellipse cx="12" cy="13.5" rx="5" ry="6.5" fill="currentColor" />
      <circle cx="12" cy="6.2" r="2.6" fill="currentColor" />
    </symbol>
  </svg>

  <!-- The sections are rendered here from assets/data/content.json (assets/js/render/sections.js). -->
  <main id="main"></main>

  <footer class="foot" data-render="footer"></footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- Libraries first (deferred, in order), then the app. three.js is loaded later, when the page is idle. -->
  <script defer src="assets/vendor/gsap.min.js"></script>
  <script defer src="assets/vendor/ScrollTrigger.min.js"></script>
  <script type="module" src="assets/js/main.js"></script>
</body>

</html>
